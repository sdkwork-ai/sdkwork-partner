# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/partner/webserver.pid;
error_log /var/log/sdkwork/partner/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name partner-staging.sdkwork.com partner-staging.birdcoder.com partner-staging.dtupay.com partner-staging.sdkwork.cn partner-staging.birdcoder.cn partner-staging.dtupay.cn partner-staging.skubc.com partner-staging.skubc.cn partner-staging.zowalk.com partner-staging.zowalk.cn partner-staging.offer86.com partner-staging.offer86.cn partner-staging.86offer.com partner-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
