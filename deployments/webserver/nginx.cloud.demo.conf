# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/partner/webserver.pid;
error_log /var/log/sdkwork/partner/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name partner-demo.sdkwork.com partner-demo.birdcoder.com partner-demo.dtupay.com partner-demo.noaper.com partner-demo.sdkwork.cn partner-demo.birdcoder.cn partner-demo.dtupay.cn partner-demo.noaper.cn partner-demo.skubc.com partner-demo.skubc.cn partner-demo.zowalk.com partner-demo.zowalk.cn partner-demo.offer86.com partner-demo.offer86.cn partner-demo.86offer.com partner-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/partner/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
